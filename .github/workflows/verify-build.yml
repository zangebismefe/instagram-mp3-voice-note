name: Verify Morphe project build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/verify-build.yml'

permissions:
  contents: read
  packages: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile experimental project
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :patches:buildAndroid --stacktrace --no-daemon
      - name: Upload prototype bundle (if produced)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morphe-experimental-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: warn
